<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>baxter / run the workflow</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="identity.css"></head><body>
<header><a href="https://lolstar123.github.io/just-a-little-further/">atul / baxter</a><a href="https://github.com/LolStar123/baxter">source</a></header>
<main>
<section class="hero"><p>discord-native llm harness</p><h1>/baxter run --verify</h1></section>
<section class="run-bar"><button id="run">run workflow</button><label>lanes<select id="capacity"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><span id="progress"></span></section>
<p id="status" role="status">loading queue…</p>
<section class="queue"><h2>scope → build → verify → handoff</h2><div id="tasks"></div></section>
<section class="report-preview"><div><h2>output</h2><p id="output-summary">run the workflow.</p></div><div id="report-preview" hidden></div></section>
<details><summary>inspect the run</summary><div class="tabs"><button id="show-artifacts" aria-pressed="true">artifacts</button><button id="show-receipts" aria-pressed="false">receipts</button></div><div id="artifact-panel"><select id="file" aria-label="File"></select><textarea id="content" rows="12" spellcheck="false"></textarea><button id="save-input">save input</button></div><div id="receipts" hidden></div><button id="export">export run</button></details>
<details><summary>test the verifier</summary><button id="break">break an input</button><button id="reset">restore</button></details>
<details><summary>edit tasks</summary><textarea id="definitions" rows="10"></textarea><button id="apply">apply</button><p id="task-error"></p></details>
</main><script type="module" src="app.mjs"></script></body></html>
