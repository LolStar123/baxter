<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19171e"><title>Baxter | Workflow room</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><header class="app-header"><a class="brand" href="https://lolstar123.github.io/just-a-little-further/"><span class="brand-mark">b</span>baxter</a><div class="header-links"><span class="local-badge">Local demo</span><a href="https://github.com/LolStar123/baxter">GitHub ↗</a></div></header>
<main class="workspace">
<section class="channel" id="channel" aria-labelledby="page-title"><div class="channel-head"><div><h1 id="page-title"><span>#</span> orders-report</h1></div></div>
<div class="conversation"><div class="request-message"><div><div class="attachment"><span class="file-icon" aria-hidden="true">CSV</span><div><strong id="input-name">orders.csv</strong><small id="input-meta">240 source rows · synthetic</small></div><label class="attach-action">Replace<input id="input-file" type="file" accept=".csv,text/csv" aria-label="Replace order CSV"></label></div><p id="input-status" role="status"></p></div></div>
<section class="run-bar" aria-label="Run controls"><label>Workers<select id="capacity" aria-label="Worker capacity"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><button id="run" class="primary" disabled>Run <span aria-hidden="true">↗</span></button></section>
<div class="workflow-map" aria-label="Workflow stages"><span data-beat="scope">Scope</span><i aria-hidden="true">›</i><span data-beat="schedule">Schedule</span><i aria-hidden="true">›</i><span data-beat="execute">Execute</span><i aria-hidden="true">›</i><span data-beat="verify">Verify</span></div><div class="run-ledger"><span id="run-phase" role="status" aria-live="polite">Loading workflow</span><span id="run-count"></span></div><p id="status" role="status" aria-live="polite"></p>
<details class="queue"><summary id="queue-title">Jobs</summary><div id="tasks"></div></details>
<section class="report-preview" aria-label="Report handoff"><div class="report-intro"><span class="baxter-avatar" aria-hidden="true"></span><div><p id="output-summary">Report</p></div></div><div id="report-preview" hidden></div></section></div></section>
<aside class="proof-rail" aria-label="Artifacts and verification"><details class="inspector"><summary>Files</summary><div class="tabs"><button id="show-artifacts" aria-pressed="true">Artifacts</button><button id="show-receipts" aria-pressed="false">Receipts</button></div><div id="artifact-panel"><label for="file" class="sr-only">Select run file</label><select id="file"></select><label for="content" class="sr-only">File contents</label><textarea id="content" rows="14" spellcheck="false"></textarea><button id="save-input">Save input</button></div><div id="receipts" hidden></div><button id="export" class="export-button">Export <span aria-hidden="true">↓</span></button></details><details><summary>Failure drill</summary><button id="break">Negative quantity</button><button id="reset">Reset</button></details><details><summary>Edit workflow</summary><label for="definitions" class="sr-only">Task definitions and dependencies</label><textarea id="definitions" rows="10" spellcheck="false"></textarea><button id="apply">Apply workflow</button><p id="task-error" role="status"></p></details></aside></main><script type="module" src="app.mjs"></script></body></html>
