<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Baxter system readout</title>
  <desc id="desc">A dark instrumentation panel showing intake, gate, build, and proof online.</desc>
  <rect width="1200" height="360" rx="2" fill="#0b0f14"/>
  <g stroke="#25303b" stroke-width="1">
    <path d="M0 72H1200M0 288H1200"/>
    <path d="M696 72V288"/>
  </g>
  <g fill="#7f8b97" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2">
    <text x="56" y="43">BAXTER / SYSTEM READOUT</text>
    <text x="1144" y="43" text-anchor="end">PUBLIC CORE / 2026</text>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="56" y="161" fill="#f2eee5" font-size="70" font-weight="720" letter-spacing="8">BAXTER</text>
    <text x="59" y="201" fill="#a8b0b9" font-size="19" letter-spacing="2">AUTONOMOUS CHIEF-OF-STAFF</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
    <text x="59" y="253" fill="#d9ad55">25 MODULES</text>
    <text x="183" y="253" fill="#56616d">/</text>
    <text x="207" y="253" fill="#d9ad55">30,234 SOURCE LINES</text>
    <text x="59" y="319" fill="#66717d" letter-spacing="1.4">CLAIM != FACT  /  SECOND-PASS VERIFICATION REQUIRED</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="746" y="106" fill="#66717d" font-size="12" letter-spacing="2">CONTROL PATH</text>
    <path d="M763 136V253" stroke="#6f5729" stroke-width="2"/>
    <g fill="#d9ad55">
      <circle cx="763" cy="145" r="5"/>
      <circle cx="763" cy="180" r="5"/>
      <circle cx="763" cy="215" r="5"/>
      <circle cx="763" cy="250" r="5"/>
    </g>
    <g fill="#d6dbe0" font-size="15">
      <text x="790" y="150">01  INTAKE</text>
      <text x="790" y="185">02  PRD GATE</text>
      <text x="790" y="220">03  BUILD / 10 LANES</text>
      <text x="790" y="255">04  PROVE</text>
    </g>
    <g fill="#d9ad55" font-size="12" letter-spacing="1.5">
      <text x="1110" y="150" text-anchor="end">ONLINE</text>
      <text x="1110" y="185" text-anchor="end">ARMED</text>
      <text x="1110" y="220" text-anchor="end">BOUNDED</text>
      <text x="1110" y="255" text-anchor="end">REQUIRED</text>
    </g>
  </g>
</svg>
