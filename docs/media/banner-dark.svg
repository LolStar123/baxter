<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <style>
    .beat { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 3.5s cubic-bezier(0.2,0,0,1) 0.3s forwards; }
    .dot  { animation: pulse 2s ease-in-out 3.8s infinite; transform-origin: 1108px 130px; }
    .tipd { opacity: 0; animation: rise 0.6s ease-out 3.6s forwards; }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes rise  { to { opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(2.4); opacity: 0; } }
  </style>

  <rect width="1200" height="260" fill="#0d1117"/>

  <g stroke="#f0f6fc" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="65"  x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- heartbeat trace: flat, spike (a triage wake), flat -->
  <path class="beat" pathLength="1" fill="none" stroke="#e3b341" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"
        d="M560 130 L700 130 L724 130 L736 96 L752 172 L766 62 L782 168 L794 112 L806 130 L900 130 L1108 130"/>
  <g class="tipd">
    <circle class="dot" cx="1108" cy="130" r="4" fill="#e3b341"/>
    <circle cx="1108" cy="130" r="4" fill="#e3b341"/>
    <text x="1108" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#e3b341"
          font-family="Consolas, 'Cascadia Code', monospace">alive</text>
  </g>

  <text x="64" y="118" font-size="64" font-weight="700" letter-spacing="6" fill="#f0f6fc">BAXTER</text>
  <text x="67" y="158" font-size="20" fill="#9198a1">An autonomous chief-of-staff that reads four inboxes, builds its own features,</text>
  <text x="67" y="186" font-size="20" fill="#9198a1">and refuses to trust its own work until a second opinion proves it.</text>
  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="15">
    <text x="67" y="226" fill="#6e7681">48k lines core &#183; 29k lines of exams &#183; 0 unsupervised sends</text>
  </g>
</svg>
